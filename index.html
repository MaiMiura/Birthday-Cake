<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday</title>
  <meta name="description" content="願いごとをして、ろうそくをふーっと吹き消そう">
  <meta name="theme-color" content="#140b1c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-lit">
  <div class="bg bg-night" aria-hidden="true"></div>
  <div class="bg room-glow" id="room-glow" aria-hidden="true"></div>
  <div class="bg bg-party" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="stage">
    <div class="top">
      <p class="prompt" id="prompt">願いごとをして、ふーっと吹いてね</p>

      <section class="celebration" id="celebration" aria-live="polite" hidden>
        <p class="hb">Happy Birthday</p>
        <h1 class="name" id="name"></h1>
        <p class="congrats">お誕生日おめでとう！</p>
        <p class="message" id="message"></p>
      </section>
    </div>

    <div class="cake-wrap">
      <svg id="cake" viewBox="0 60 400 315" tabindex="0" role="button"
           aria-label="ろうそくの立ったバースデーケーキ。タップするとろうそくが消えます">
        <defs>
          <linearGradient id="g-side" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#e59a86"/>
            <stop offset=".22" stop-color="#f6c2b0"/>
            <stop offset=".6" stop-color="#f9d1c0"/>
            <stop offset="1" stop-color="#df937e"/>
          </linearGradient>
          <linearGradient id="g-ribbon" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#d9637f"/>
            <stop offset=".3" stop-color="#f2849e"/>
            <stop offset="1" stop-color="#cf5a77"/>
          </linearGradient>
          <radialGradient id="g-top" cx=".5" cy=".35" r=".75">
            <stop offset="0" stop-color="#fffaf6"/>
            <stop offset="1" stop-color="#f4e2d8"/>
          </radialGradient>
          <linearGradient id="g-plate" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#f4f1fa"/>
            <stop offset="1" stop-color="#c7bdd9"/>
          </linearGradient>
          <linearGradient id="g-flame" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#ff8a2b"/>
            <stop offset=".45" stop-color="#ffc54d"/>
            <stop offset="1" stop-color="#ff7a22"/>
          </linearGradient>
          <radialGradient id="g-glow">
            <stop offset="0" stop-color="#ffd27a" stop-opacity=".6"/>
            <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="g-candleshade" gradientUnits="userSpaceOnUse" cx="200" cy="185" r="230">
            <stop offset="0" stop-color="#1a0b22" stop-opacity="0"/>
            <stop offset=".35" stop-color="#1a0b22" stop-opacity=".12"/>
            <stop offset="1" stop-color="#12061a" stop-opacity=".7"/>
          </radialGradient>
          <pattern id="p-stripes" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
            <rect width="2.6" height="7" fill="#fff" fill-opacity=".6"/>
          </pattern>
          <clipPath id="clip-cake">
            <ellipse cx="200" cy="330" rx="165" ry="30"/>
            <path d="M85 215 A115 26 0 0 1 315 215 V312 A115 26 0 0 1 85 312 Z"/>
          </clipPath>
        </defs>

        <!-- お皿 -->
        <ellipse cx="200" cy="339" rx="168" ry="30" fill="#000" opacity=".2"/>
        <ellipse cx="200" cy="330" rx="165" ry="30" fill="url(#g-plate)"/>
        <ellipse cx="200" cy="328" rx="145" ry="23" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>

        <!-- ケーキ本体 -->
        <path d="M85 215 V312 A115 26 0 0 0 315 312 V215 Z" fill="url(#g-side)"/>
        <path d="M85 270 A115 26 0 0 0 315 270 V283 A115 26 0 0 1 85 283 Z" fill="url(#g-ribbon)"/>
        <g id="sprinkles"></g>
        <g id="drips"></g>
        <ellipse cx="200" cy="215" rx="115" ry="26" fill="url(#g-top)"/>
        <g id="rim"></g>

        <!-- 部屋の明かりの陰影 -->
        <g clip-path="url(#clip-cake)">
          <rect id="shade-candle" x="0" y="60" width="400" height="320" fill="url(#g-candleshade)"/>
          <rect id="shade-dark" x="0" y="60" width="400" height="320" fill="#0d0614"/>
        </g>

        <g id="candles"></g>
      </svg>
    </div>

    <div class="bottom">
      <p class="hint" id="hint" aria-live="polite"></p>
      <button type="button" class="again" id="again" hidden>もう一度ろうそくをつける</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
