<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday</title>
  <meta name="description" content="願いごとをして、ろうそくをふーっと吹き消そう">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Shippori+Mincho+B1:wght@600;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // テーマは描画前に決めて、ちらつきを防ぐ
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      document.documentElement.dataset.theme = /^choco/.test(t || '') ? 'chocolate' : 'strawberry';
    })();
  </script>
</head>
<body class="is-lit">
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="dim" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="stage">
    <div class="top">
      <p class="prompt" id="prompt">願いごとをして、<br>ふーっと吹いてね</p>

      <section class="celebration" id="celebration" aria-live="polite" hidden>
        <p class="hb">Happy Birthday</p>
        <h1 class="name" id="name"></h1>
        <div class="gap" aria-hidden="true"></div>
        <div class="divider" aria-hidden="true"><span></span></div>
        <p class="message" id="message"></p>
      </section>
    </div>

    <div class="scene" id="scene">
      <img class="photo" id="photo" alt="" width="941" height="1262">
      <div class="shade" aria-hidden="true"></div>
      <svg id="cake" viewBox="0 0 941 1262" tabindex="0" role="button"
           aria-label="ろうそくの立ったバースデーケーキ。タップするとろうそくが消えます">
        <defs>
          <linearGradient id="g-flame" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#ff7a1f" stop-opacity=".9"/>
            <stop offset=".18" stop-color="#ffb347"/>
            <stop offset=".5" stop-color="#ffe7a8"/>
            <stop offset=".85" stop-color="#ffc66b"/>
            <stop offset="1" stop-color="#ff9a3c" stop-opacity=".7"/>
          </linearGradient>
          <linearGradient id="g-core" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#fff6d8" stop-opacity=".6"/>
            <stop offset=".3" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#fffbe8" stop-opacity=".85"/>
          </linearGradient>
          <radialGradient id="g-glow">
            <stop offset="0" stop-color="#ffd58a" stop-opacity=".55"/>
            <stop offset=".45" stop-color="#ffb357" stop-opacity=".2"/>
            <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
          </radialGradient>
          <filter id="f-smoke" x="-200%" y="-200%" width="500%" height="500%">
            <feGaussianBlur stdDeviation="4"/>
          </filter>
          <filter id="f-soft" x="-50%" y="-20%" width="200%" height="140%">
            <feGaussianBlur stdDeviation="2.2"/>
          </filter>
        </defs>
        <g id="candles"></g>
      </svg>
      <button type="button" class="again" id="again" hidden>もう一度ろうそくをつける</button>
    </div>

    <p class="hint" id="hint" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
